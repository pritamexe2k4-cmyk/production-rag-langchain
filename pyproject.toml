# Base = production-course-main-code/pyproject.toml (course dependency list).
# GLUE (not from course): the lines marked "+" were added so one environment runs
# every part: the lang-production-api app (langsmith, pydantic-settings, slowapi)
# and the Part 6 scripts (networkx, tiktoken, openai, langchain-text-splitters).
[project]
name = "production-rag-langchain"
version = "0.1.0"
description = "Production RAG assembled from the freeCodeCamp / Paulo Dichone course code"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-community>=0.4.1",
    "langchain>=1.2.7",
    "langchain-anthropic>=1.3.1",
    "langchain-core>=1.2.7",
    "langchain-openai>=1.1.7",
    "langgraph>=1.0.7",
    "python-dotenv>=1.2.1",
    "bs4>=0.0.2",
    "pypdf>=6.6.2",
    "langchain-ollama>=1.0.1",
    "langchain-chroma>=1.1.0",
    "rank-bm25>=0.2.2",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "pytest>=9.0.2",
    "fastapi>=0.129.0",
    "uvicorn>=0.40.0",
    "langsmith>=0.7.4",              # + app/ (lang-production-api)
    "pydantic-settings>=2.13.1",     # + app/ (lang-production-api)
    "slowapi>=0.1.9",                # + app/ (lang-production-api)
    "networkx>=3.6.1",               # + part6 (GraphRAG)
    "tiktoken>=0.12.0",              # + part6 (long context / late chunking)
    "openai>=2.32.0",                # + part6
    "langchain-text-splitters>=1.1.2",  # + part6
    "python-docx>=1.1.2",            # + phase 1: DOCX loader (HR corpus)
    "httpx>=0.28.1",                 # + phase 1: Cohere rerank option (also used by tests)
    "pdfplumber>=0.11.10",
]

[project.optional-dependencies]
# + phase 1: local cross-encoder reranker. Pulls PyTorch (large). Install with:
#   uv sync --extra rerank
rerank = ["sentence-transformers>=5.0.0"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",                 # + TestClient for tests/test_api.py (lang-production-api dev dep)
    "reportlab>=4.2",                # + phase 1: only used by scripts/build_hr_corpus.py to render PDFs
]

[tool.pytest.ini_options]
# GLUE (not from course): only run our tests; part*/ scripts are learning references
# (testing_patterns.py contains course-style tests and can be run explicitly).
testpaths = ["tests"]
pythonpath = ["."]
