# SOURCE: lang-production-api docker-compose.yml (GLUE edits marked)
# @format

services:
  agent-api:
    build: .
    ports:
      - '8000:8000'
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
      # PHASE 1 (our addition): image has no torch; use RERANKER=cohere (+ COHERE_API_KEY) for reranking
      - RERANKER=${RERANKER:-none}
    # GLUE (not from course): keep the Chroma vector DB between container restarts
    volumes:
      - chroma_data:/app/chroma_db
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped


volumes:
  chroma_data:
